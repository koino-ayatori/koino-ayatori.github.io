<meta property="og:title" content="恋の癖診断｜恋のあやとり">
<meta property="og:description" content="10問・約1分・登録不要。あなたの恋がからまる場所に名前をつけます。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --paper:#F6EEF0;--paper-2:#EEE1E5;--card:#FBF6F7;--ink:#3A2E3F;--ink-soft:#7A6A75;
  --thread:#C2416B;--line:#D9C5CC;--on-thread:#FFF7F9;--good:#3F8F7A;--bad:#C2416B;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#241D2A;--paper-2:#2E2535;--card:#2A2230;--ink:#F1E6EA;--ink-soft:#B6A3AE;
    --thread:#E36F94;--line:#4A3D52;--on-thread:#241D2A;--good:#7CC7B2;--bad:#E36F94;
  }
}
:root[data-theme="dark"]{
  --paper:#241D2A;--paper-2:#2E2535;--card:#2A2230;--ink:#F1E6EA;--ink-soft:#B6A3AE;
  --thread:#E36F94;--line:#4A3D52;--on-thread:#241D2A;--good:#7CC7B2;--bad:#E36F94;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  font-size:16px;line-height:1.85;-webkit-font-smoothing:antialiased}
main{max-width:30rem;margin:0 auto;padding:2rem 1.25rem 3rem}
.mincho{font-family:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif}
.screen{display:none}.screen.on{display:block}
svg.ayatori{display:block;width:100%;height:auto;max-width:17rem;margin:0 auto}
svg.ayatori path{fill:none;stroke:var(--thread);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
svg.ayatori circle{fill:var(--ink)}
.draw path{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 2.2s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.draw path{animation:none;stroke-dashoffset:0}}
h1{font-size:2.1rem;line-height:1.35;font-weight:700;margin:1.5rem 0 1rem;letter-spacing:.04em}
.lead{color:var(--ink-soft);margin:0 0 1.5rem}
.facts{display:flex;gap:1.5rem;margin:0 0 2rem;color:var(--ink-soft);font-size:.875rem}
.facts b{display:block;color:var(--ink);font-size:1.25rem;font-weight:500}
button,.btn{font:inherit;cursor:pointer;border:none;border-radius:999px;padding:1rem 1.5rem;width:100%;
  font-size:1rem;font-weight:500;text-align:center;text-decoration:none;display:block}
.primary{background:var(--thread);color:var(--on-thread)}
.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:focus-visible,.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.note{font-size:.8rem;color:var(--ink-soft);margin-top:1rem}
.progress{height:2px;background:var(--line);margin-bottom:2rem;position:relative}
.progress span{position:absolute;inset:0 auto 0 0;background:var(--thread);transition:width .3s}
.qnum{font-size:.875rem;color:var(--ink-soft);margin:0 0 .5rem}
.q{font-size:1.4rem;line-height:1.6;margin:0 0 2rem;min-height:4.5rem}
.opt{background:var(--paper-2);color:var(--ink);border-radius:1rem;text-align:left;padding:1.1rem 1.25rem;
  margin-bottom:.75rem;border:1px solid transparent}
.opt:hover{border-color:var(--thread)}
.back{background:none;color:var(--ink-soft);width:auto;padding:.5rem 0;font-size:.875rem;margin-top:1rem}

/* 結果 */
.rtype{font-size:.875rem;color:var(--ink-soft);margin:1.25rem 0 .25rem;text-align:center}
.rname{font-size:2.4rem;text-align:center;margin:0 0 .5rem;letter-spacing:.08em;white-space:nowrap}
.rcatch{text-align:center;margin:0 0 1.5rem}
.axes{margin:0 0 .5rem}
.axis{margin-bottom:.9rem}
.axis-lab{display:flex;justify-content:space-between;font-size:.8rem;color:var(--ink-soft)}
.axis-lab b{color:var(--ink);font-weight:500}
.axis-bar{height:6px;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
.axis-bar span{position:absolute;inset:0 auto 0 0;background:var(--thread);border-radius:3px}
section.blk{background:var(--card);border-radius:1.5rem;padding:1.6rem 1.4rem;margin-top:1.1rem;box-shadow:0 2px 0 var(--line)}
.blk h2{font-size:1.1rem;line-height:1.5;margin:0 0 .75rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:.55rem}
.blk h2::before{content:"";flex:0 0 .6rem;width:.6rem;height:.6rem;border-radius:50%;background:var(--thread)}
.blk p{margin:0 0 .75rem}.blk p:last-child{margin-bottom:0}
.list{list-style:none;margin:0;padding:0}
.list.ring li{border-top:none;padding:.45rem 0 .45rem 2rem;position:relative}
.list.ring li::before{content:"";position:absolute;left:0;top:.8rem;width:1.1rem;height:1.1rem;border-radius:50%;border:3px solid var(--thread)}
.list.bubble li{border-top:none;background:var(--paper-2);border-radius:1rem;padding:.85rem 1rem;margin-bottom:.6rem}
.list.bubble li:last-child{margin-bottom:0}
.list li{padding:.6rem 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:none;padding-top:0}
.quote{background:var(--paper-2);border-radius:.9rem;padding:.8rem 1rem;margin-bottom:.6rem}
.quote:last-child{margin-bottom:0}
.tonight{border:1.5px dashed var(--thread);background:transparent}
.tonight h2{color:var(--thread)}
.match{display:flex;gap:1rem;align-items:flex-start;background:var(--paper-2);border-radius:1.1rem;padding:1rem;margin-bottom:.7rem}
.mi{position:relative;flex:0 0 3.6rem}
.badge{position:absolute;right:-.4rem;bottom:-.4rem;width:1.6rem;height:1.6rem;border-radius:50%;background:var(--card);
  display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:500;box-shadow:0 1px 0 var(--line)}
.badge.g{color:var(--good)}.badge.b{color:var(--bad)}
.match svg{display:block;width:3.6rem;height:auto}
.match svg path{fill:none;stroke:var(--thread);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.match svg circle{fill:var(--ink)}
.match b{display:block}
.mark{font-size:.8rem;font-weight:500}
.mark.g{color:var(--good)}.mark.b{color:var(--bad)}
.match small{display:block;color:var(--ink-soft);font-size:.875rem;line-height:1.7}
.subh{font-size:1rem;font-weight:500;color:var(--ink);margin:1.25rem 0 .6rem}
.subh:first-of-type{margin-top:0}
.cta{background:var(--card);border-radius:1.5rem;padding:1.6rem 1.4rem;margin-top:1.1rem;box-shadow:0 2px 0 var(--line)}
.cta .pr-top{font-size:.75rem;color:var(--ink-soft);margin:0 0 .6rem}
.cta h2{font-size:1.15rem;margin:0 0 .75rem;white-space:nowrap;display:flex;align-items:center;gap:.55rem}
.cta h2::before{content:"";flex:0 0 .6rem;width:.6rem;height:.6rem;border-radius:50%;background:var(--thread)}
.cta p{margin:0 0 1.25rem}
.cta .btn{background:var(--thread);color:var(--on-thread);padding:1.15rem 1.5rem}
#rend span{display:block;white-space:nowrap;font-size:.95rem}
body{word-break:auto-phrase}
.q-next{font-weight:700;color:var(--thread);margin-top:1rem !important}
.cta.hero{border:2px solid var(--thread);box-shadow:0 0 0 6px color-mix(in srgb,var(--thread) 14%,transparent),0 10px 30px color-mix(in srgb,var(--thread) 22%,transparent);margin-top:1.75rem}
.cta .lead-in{font-size:1.05rem;color:var(--thread);font-weight:700;text-align:center;margin:0 0 1rem;white-space:nowrap}
.cta.hero .btn{font-size:.95rem;font-weight:700;padding:1.2rem .75rem;white-space:nowrap;animation:pulse 2.4s ease-in-out 1s 3}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@media (prefers-reduced-motion: reduce){.cta.hero .btn{animation:none}}
.cta .cover{display:block;width:100%;height:auto;border-radius:1rem;margin:0 0 1rem}
.cta .two{font-size:.875rem;line-height:1.8}
.cta .two span{display:block;white-space:nowrap}
.cta-mini{margin-top:1.1rem;padding:1.2rem 1.4rem;border-radius:1.5rem;border:1.5px solid var(--thread);text-align:center}
.cta-mini p{margin:0 0 .8rem;font-size:.875rem}
.cta-mini .btn{background:transparent;color:var(--thread);border:1.5px solid var(--thread);padding:.75rem 1rem;font-size:.9rem}
.cta .pr{font-size:.75rem;color:var(--ink-soft);margin:.75rem 0 0;text-align:center}
.row{display:flex;gap:.75rem;margin-top:1.25rem}
.row button{flex:1}
.toast{position:fixed;left:50%;bottom:calc(1.5rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:.6rem 1.1rem;border-radius:999px;font-size:.875rem;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
footer{max-width:30rem;margin:0 auto;padding:0 1.25rem 2rem;font-size:.75rem;color:var(--ink-soft);line-height:1.7}
</style>
</head>

const STORE = "ayatori_shindan_v5";
let answers = [], idx = 0, lastKey = null;
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function show(id){ document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on")); $(id).classList.add("on"); window.scrollTo(0,0); }
function save(){ try{ localStorage.setItem(STORE, JSON.stringify({answers,idx})); }catch(e){} }
function load(){ try{ const v = JSON.parse(localStorage.getItem(STORE)); return v && Array.isArray(v.answers) ? v : null; }catch(e){ return null; } }
function clear(){ try{ localStorage.removeItem(STORE); }catch(e){} }
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("on"); setTimeout(()=>t.classList.remove("on"),1800); }

function renderQ(){
  const item = QUESTIONS[idx];
  $("bar").style.width = (idx / QUESTIONS.length * 100) + "%";
  $("qnum").textContent = (idx + 1) + " / " + QUESTIONS.length;
  $("qtext").textContent = item.q;
  const box = $("opts"); box.innerHTML = "";
  item.a.forEach((label,i)=>{
    const b=document.createElement("button"); b.className="opt"; b.textContent=label; b.onclick=()=>pick(i); box.appendChild(b);
  });
  $("backBtn").style.visibility = idx === 0 ? "hidden" : "visible";
}
function pick(i){ answers[idx]=i; idx++; save(); if(idx>=QUESTIONS.length) finish(); else renderQ(); }

function finish(){
  const score={A:0,B:0,C:0};
  QUESTIONS.forEach((q,i)=>{ score[q.axis]+=answers[i]; });
  const cnt={A:0,B:0,C:0}; const first={};
  QUESTIONS.forEach((q,i)=>{ cnt[q.axis]++; if(first[q.axis]===undefined) first[q.axis]=answers[i]; });
  const side=k=>{ const r=score[k]/cnt[k]; return r>0.5?1:(r<0.5?0:first[k]); };
  const key=["A","B","C"].map(k=>String(side(k))).join("");
  lastKey=key;
  const t=TYPES[key];
  $("rname").textContent=t.name;
  $("rcatch").textContent=t.catch;
  $("hType").textContent=t.name+"のあなた";
  $("rdesc").innerHTML=t.desc.map(p=>"<p>"+esc(p)+"</p>").join("");
  $("rstr").innerHTML=t.str.map(s=>"<li>"+esc(s)+"</li>").join("");
  $("rmom").innerHTML=t.mom.map(s=>"<li>"+esc(s)+"</li>").join("");
  const x=EXTRA[key];
  $("rend").innerHTML=t.end.map(l=>"<span>"+esc(l)+"</span>").join("");
  $("rwords").innerHTML=t.words.map(w=>'<div class="quote">'+esc(w)+'</div>').join("");
  const m = (arr,kind)=> arr.map(k=>'<div class="match"><div class="mi"><svg viewBox="0 0 300 200" aria-hidden="true">'+shapeSVG(k)+'</svg><span class="badge '+(kind==="good"?"g":"b")+'">'+(kind==="good"?"◎":"×")+'</span></div><div>'+
      '<b class="mincho">'+TYPES[k].name+'</b><small>'+TYPES[k].catch+'</small></div></div>').join("");
  $("rmatch").innerHTML='<p class="subh">'+MATCH_NOTE.good+'</p>'+m(t.good,"good")+'<p class="subh">'+MATCH_NOTE.bad+'</p>'+m(t.bad,"bad");
  const svg=$("rsvg"); svg.innerHTML=shapeSVG(key).replace(/r="7"/g,'r="5"');
  svg.classList.remove("draw"); void svg.offsetWidth; svg.classList.add("draw");
  track("quiz_complete",{type_name:t.name,type_key:key});
  clear(); show("result");
}

async function shareResult(){
  if(!lastKey) return;
  track("share_click",{type_name:TYPES[lastKey].name});
  const t=TYPES[lastKey];
  const url=location.href.split("#")[0];
  const text="私の恋の結び目は「"+t.name+"」でした。\n"+t.catch+"\n"+SHARE_TAG+"\n";
  if(navigator.share){ try{ await navigator.share({text, url}); return; }catch(e){ if(e && e.name==="AbortError") return; } }
  try{ await navigator.clipboard.writeText(text+url); toast("結果をコピーしました"); }
  catch(e){ toast("コピーできませんでした。画面を長押ししてコピーしてください"); }
}

let UTM_SOURCE="(none)";
try{ UTM_SOURCE=new URLSearchParams(location.search).get("utm_source")||"(none)"; }catch(e){}
$("ctaLink").href=AFFILIATE_URL;
$("ctaLink").addEventListener("click",()=>track("cta_click",{type_name:lastKey?TYPES[lastKey].name:"",position:"bottom",utm_source:UTM_SOURCE}));
$("ctaImg").href=AFFILIATE_URL;
$("ctaImg").addEventListener("click",()=>track("cta_click",{type_name:lastKey?TYPES[lastKey].name:"",position:"cover",utm_source:UTM_SOURCE}));
$("startBtn").onclick=()=>{ answers=[]; idx=0; clear(); track("quiz_start"); show("quiz"); renderQ(); };
$("resumeBtn").onclick=()=>{ const v=load(); if(v){ answers=v.answers; idx=v.idx; } show("quiz"); renderQ(); };
$("backBtn").onclick=()=>{ if(idx>0){ idx--; save(); renderQ(); } };
$("retryBtn").onclick=()=>{ answers=[]; idx=0; track("quiz_retry"); show("intro"); };
$("copyBtn").onclick=shareResult;
const saved=load();
if(saved && saved.idx>0 && saved.idx<QUESTIONS.length){ $("resumeBtn").hidden=false; }
</script>
</body>
</html>
