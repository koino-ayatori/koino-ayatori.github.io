<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>恋のあやとり</title>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-LZFV1CB90X"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-LZFV1CB90X');
</script>
<noscript><meta http-equiv="refresh" content="0;url=https://note.com/koino_ayatori"></noscript>
<style>
  html,body{margin:0;height:100%;background:#faf6f3;color:#4a3f3a;font-family:"Hiragino Mincho ProN","Yu Mincho",serif}
  body{display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
  p{margin:0 0 16px;font-size:16px;line-height:1.8}
  a{color:#4a3f3a}
</style>
</head>
<body>
<div>
  <p id="msg">移動します</p>
  <p><a id="go" href="https://note.com/koino_ayatori">移動しない場合はこちら</a></p>
</div>
<script>
(function(){
  var NOTE_URL = "https://note.com/koino_ayatori";
  // 紹介クリックをスプレッドシートに記録する Apps Script のURL（デプロイ後に入れる）
  var CLICK_LOG_URL = "";
  // 紹介リンク用の飛び先。記事のURLを入れると ?to= で指定できる（空なら棚へ）
  var DEST = {
    shelf:    NOTE_URL,
    iriguchi: "https://note.com/koino_ayatori/n/n6133b958445d", // 入口980円『【完全保存版】彼に振り回されない恋の仕方』
    book1:    "https://note.com/koino_ayatori/n/nd3b10ac212e7", // 1冊目 『【完全保存版】「彼の気持ちが分からない」彼から一生愛され・求められ続ける『恋のあやとりの法則』』
    book2:    "https://note.com/koino_ayatori/n/nb4c7a599150c", // 2冊目『すれ違いを絆に変える』
    guide:    "https://note.com/koino_ayatori/n/n040db025b3a8", // DM「気になる」返しの相談案内note（?to=guide&utm_source=instagram_dm）
    instagram:"https://www.instagram.com/koino_ayatori/"        // TikTokのプロフィール用（?to=instagram&utm_source=tiktok）
  };
  var q = null;
  try { q = new URLSearchParams(location.search); } catch(e){}
  function clean(v){ return (v || "").toLowerCase().replace(/[^a-z0-9_-]/g, "").slice(0, 30); }
  var ref = q ? clean(q.get("ref")) : "";
  var to  = q ? clean(q.get("to"))  : "";
  var utm = (q && q.get("utm_source")) || "(none)";
  if (ref) utm = "aff_" + ref;
  var dest = (to && DEST[to]) ? DEST[to] : NOTE_URL;
  var destName = (to && DEST[to]) ? to : "shelf";
  try { document.getElementById("go").href = dest; } catch(e){}
  try { if (to === "instagram") document.getElementById("msg").textContent = "Instagramへ移動します"; else document.getElementById("msg").textContent = "noteへ移動します"; } catch(e){}
  var done = false;
  function go(){
    if (done) return;
    done = true;
    location.replace(dest);
  }
  if (ref && CLICK_LOG_URL) {
    try {
      var body = new URLSearchParams({ action: "click", aff: ref, dest: destName });
      if (!(navigator.sendBeacon && navigator.sendBeacon(CLICK_LOG_URL, body))) {
        fetch(CLICK_LOG_URL, { method: "POST", body: body, mode: "no-cors", keepalive: true });
      }
    } catch(e){}
  }
  try {
    if (window.gtag) {
      if (ref) {
        gtag('event', 'affiliate_click', {
          aff_id: ref,
          utm_source: utm,
          destination: destName,
          transport_type: 'beacon'
        });
      }
      gtag('event', 'note_redirect', {
        utm_source: utm,
        aff_id: ref || "(none)",
        destination: destName,
        transport_type: 'beacon',
        event_callback: go,
        event_timeout: 800
      });
    }
  } catch(e){}
  setTimeout(go, 900);
})();
</script>
</body>
</html>
