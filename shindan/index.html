<style>

<body>
<button id="snd" class="hide" aria-label="音楽のオン・オフ">♪</button>
<div class="wrap" id="app"></div>
<script>
var FUTURES=[
 {k:'patience',t:'安心して眠れる夜'},
 {k:'fact',t:'相手の返信に一喜一憂しない毎日'},
 {k:'voice',t:'相手に本音を言える関係'},
 {k:'worth',t:'相手に大切にされている実感'}
];
// 各選択肢が指す「足りない力」: patience=待てる余裕 / fact=事実と想像を分ける力 / voice=自分から伝える力 / worth=相手の反応で自分の価値を決めない力
var Q=[
 {q:'恋がうまくいくなら、\nどんな未来がいいですか？',future:true},
 {q:'相手からの返信が、\nいつもより遅いとき',o:[
  ['何度もスマホを開いて、確かめてしまう','patience'],
  ['嫌われた理由を、考え続けてしまう','fact'],
  ['気になるけれど、聞けずに黙る','voice'],
  ['大切にされていない気がする','worth']]},
 {q:'相手の機嫌が、\n悪そうなとき',o:[
  ['気になって、様子を何度も見に行く','patience'],
  ['自分が何かしたのかと、原因を探す','fact'],
  ['気づかないふりをして、いつも通りにする','voice'],
  ['自分の価値が下がった気がする','worth']]},
 {q:'寂しいと感じたとき',o:[
  ['すぐ連絡して、安心したくなる','patience'],
  ['愛されていないからだ、と考えてしまう','fact'],
  ['「大丈夫」と、先に言ってしまう','voice'],
  ['自分の存在が、小さくなった気がする','worth']]},
 {q:'夜、ベッドに入ってから',o:[
  ['相手の返事を待って、眠れない','patience'],
  ['その日の会話の意味を、何度も考える','fact'],
  ['言えなかった一言が、頭に残る','voice'],
  ['「私は大丈夫かな」と、自分を責める','worth']]},
 {q:'相手に、\n不満があるとき',o:[
  ['すぐ言いたくなって、勢いで伝える','patience'],
  ['相手はこう思っているはず、と決めつける','fact'],
  ['言わずに、飲み込む','voice'],
  ['言うと嫌われそうで、言えない','worth']]},
 {q:'会ったあとの帰り道',o:[
  ['次の約束が決まるまで、落ち着かない','patience'],
  ['相手の表情を思い返して、意味を探す','fact'],
  ['本当はもっと話したかった、と思う','voice'],
  ['相手が楽しそうでないと、自分のせいだと思う','worth']]},
 {q:'相手の何気ない一言が、\n気になったとき',o:[
  ['すぐ確かめたくなる','patience'],
  ['言葉の裏の意味を、考えてしまう','fact'],
  ['傷ついても、笑って流す','voice'],
  ['その一言で、自分の価値が揺らぐ','worth']]},
 {q:'不安がいちばん大きいとき、\nついやってしまうのは',o:[
  ['確かめる連絡を、送ってしまう','patience'],
  ['最悪の場面を、想像してしまう','fact'],
  ['友達には話すが、本人には言わない','voice'],
  ['「私には魅力がない」と考える','worth']]},
 {q:'いま、いちばん近いのは',o:[
  ['返事を待つ時間が、つらい','patience'],
  ['相手の気持ちが、分からない','fact'],
  ['本音を、言えていない','voice'],
  ['自分に、自信が持てない','worth']]}
];
var R={
 patience:{n:'待てる余裕',c:'#ff9fb5',
  s:['返信を待つ間、スマホを何度も見る','確かめるLINEを送り、また不安','待つ間、仕事も約束も頭に入らない'],
  w:'確かめると、その場は安心します。\nでも長続きせず、また確かめたくなる。\nこの繰り返しが、不安を大きくしやすい。',r:'（Joiner の研究）',
  a:'不安は、通り過ぎるのを待つもの。\n待てる人は、不安がない人ではなく、\n確かめずにいられる人です。'},
 fact:{n:'事実と想像を分ける力',c:'#ff9fb5',
  s:['返信が遅いと、嫌われたと考え続ける','相手の一言の裏を、読み込んでしまう','何もないのに、別れを想像して苦しい'],
  w:'苦しさの多くは、出来事ではなく、\n受け取り方から生まれやすい。',r:'（Beck の考え方）',
  a:'苦しさをつくるのは、足した想像。\n「返信が遅い」は事実。\n「嫌われた」は想像です。'},
 voice:{n:'ためずに責めないで伝える力',c:'#ff9fb5',
  s:['寂しいのに、「大丈夫だよ」と返す','飲み込んだ本音で、ある日責めてしまう','話したいのに、喧嘩が怖くて言えない'],
  w:'飲み込んだ気持ちは、なくなりません。\nたまって、責める言葉で出やすい。',r:'',
  a:'本音は、飲み込むほど重くなる。\nためずに、責めないで伝えるほうが、\n相手も受け取りやすく、関係を守れる。'},
 worth:{n:'相手の反応で価値を決めない力',c:'#ff9fb5',
  s:['返信の早さで、大切さを測る','機嫌が悪いと、自分のせいだと感じる','相手の反応で、その日の気分が決まる'],
  w:'価値を相手の反応で測ると、\n反応のたびに気持ちが揺れやすい。',r:'（Crocker & Wolfe）',
  a:'相手の反応は、相手の事情で決まる。\nあなたの価値では決まりません。\n反応と価値は、別の場所に置く。'}
};
var BASE='https://koino-ayatori.github.io/n/';
var app=document.getElementById('app');
var bgm=null,musicOn=true,started=false;
var CH=[[220,329.63,440,523.25],[174.61,261.63,349.23,440],[261.63,392,523.25,659.25],[196,293.66,392,493.88]];
function makeWav(){
 var sr=16000,SEC=64,N=SEC*sr,buf=new Float32Array(N);
 var seed=20261126;
 function rnd(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}
 // pad: 4 slow chords, 16s each, long overlap
 var CHS=[[293.66,369.99,440,554.37],[246.94,293.66,369.99,493.88],[329.63,392,493.88,587.33],[293.66,369.99,415.3,554.37]];
 CHS.forEach(function(ch,i){
  var L=16*sr;
  for(var j=0;j<2*L;j++){
   var t=j/sr,w=Math.sin(Math.PI*j/(2*L));w=w*w;
   var v=0;
   for(var k=0;k<ch.length;k++){v+=Math.sin(2*Math.PI*ch[k]*t+k)*(1+.3*Math.sin(2*Math.PI*.07*t+k));}
   buf[(i*L+j)%N]+=v*w*.03;
  }
 });
 // sparse piano-like notes, D lydian, uneven timing
 var SC=[293.66,329.63,369.99,415.3,440,493.88,554.37,587.33,659.25,739.99,830.61,880,987.77,1108.73];
 var HA=[0,1,.16,.06,.025,.01];
 function note(t0,f,amp){
  var dur=6,n0=Math.floor(t0*sr),n=dur*sr;
  for(var j=0;j<n;j++){
   var t=j/sr,e1=Math.exp(-t*.45),env=Math.min(1,t/.03)*Math.exp(-t*.6);
   var v=0,eh=1;
   for(var h=1;h<=5;h++){eh*=e1;v+=Math.sin(6.2831853*f*h*(1+.0003*h*h)*t)*eh*HA[h];}
   buf[(n0+j)%N]+=v*env*amp;
  }
 }
 var t0=1.2,deg=6;
 while(t0<SEC-1){
  var step=Math.floor(rnd()*5)-2; if(step===0)step=(rnd()<.5?1:-1);
  deg=Math.max(0,Math.min(9,deg+step));
  note(t0,SC[deg],.075+rnd()*.03);
  if(rnd()<.15){var d2=Math.max(0,Math.min(SC.length-1,deg-2-Math.floor(rnd()*2)));note(t0+.35,SC[d2],.05);}
  t0+=2.4+rnd()*4;
 }
 // reverb (Schroeder), run twice around the loop so the seam is seamless
 function comb(x,dl,g){var y=new Float32Array(x.length),b=new Float32Array(dl);for(var i=0;i<x.length;i++){var o=b[i%dl];y[i]=o;b[i%dl]=x[i]+o*g;}return y;}
 function allp(x,dl,g){var y=new Float32Array(x.length),b=new Float32Array(dl);for(var i=0;i<x.length;i++){var o=b[i%dl];var v=x[i]+o*g;y[i]=o-g*v;b[i%dl]=v;}return y;}
 var x2=new Float32Array(2*N);x2.set(buf,0);x2.set(buf,N);
 var cs=[1687,1931,2213,2557].map(function(d,i){return comb(x2,d,.86-i*.01);});
 var wet=new Float32Array(2*N);
 for(var i=0;i<2*N;i++){wet[i]=(cs[0][i]+cs[1][i]+cs[2][i]+cs[3][i])*.25;}
 wet=allp(allp(wet,556,.5),441,.5);
 var out=new Float32Array(N),pk=0,lp=0;
 for(var n=0;n<N;n++){var v=buf[n]*.5+wet[N+n]*1.5;lp+=(v-lp)*.22;out[n]=lp;v=lp;if(Math.abs(v)>pk)pk=Math.abs(v);}
 var gain=pk>0?.8/pk:1;
 var d=new DataView(new ArrayBuffer(44+N*2));
 function w4(o,x){for(var q=0;q<4;q++)d.setUint8(o+q,x.charCodeAt(q));}
 w4(0,'RIFF');d.setUint32(4,36+N*2,true);w4(8,'WAVE');w4(12,'fmt ');d.setUint32(16,16,true);
 d.setUint16(20,1,true);d.setUint16(22,1,true);d.setUint32(24,sr,true);d.setUint32(28,sr*2,true);
 d.setUint16(32,2,true);d.setUint16(34,16,true);w4(36,'data');d.setUint32(40,N*2,true);
 for(var n=0;n<N;n++){d.setInt16(44+n*2,Math.max(-1,Math.min(1,out[n]*gain))*32000,true);}
 return new Blob([d.buffer],{type:'audio/wav'});
}
function music(){
 try{if(navigator.audioSession){navigator.audioSession.type='playback';}}catch(e){}
 bgm=new Audio(URL.createObjectURL(makeWav()));
 bgm.loop=true;bgm.volume=.55;bgm.preload='auto';
 var btn=document.getElementById('snd');btn.classList.remove('hide');
 function go(){
  if(started||!musicOn)return;
  var p=bgm.play();
  if(p&&p.then){p.then(function(){started=true;}).catch(function(){});}else{started=true;}
 }
 go();
 ['pointerdown','touchstart','touchend','click','keydown'].forEach(function(e){document.addEventListener(e,go,{passive:true});});
 btn.onclick=function(ev){
  ev.stopPropagation();
  musicOn=!musicOn;
  if(musicOn){started=false;go();}else{bgm.pause();started=false;}
  btn.style.opacity=musicOn?.85:.4;
 };
}
var step=0,future=null,score={patience:0,fact:0,voice:0,worth:0};
var qs=new URLSearchParams(location.search);
var src='shindan';
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\n/g,'<br>');}
function start(){
 app.innerHTML='<h1>なりたい恋の未来に、<br><span class="y">足りない力</span>は？</h1><p class="sub">10問・約1分。選ぶだけです。</p><button class="main" id="go">はじめる</button>';
 document.getElementById('go').onclick=function(){step=0;render();};
}
function render(){
 var q=Q[step];
 var h='<div class="prog"><i style="width:'+(step/Q.length*100)+'%"></i></div><div class="qn">Q'+(step+1)+' / '+Q.length+'</div><h2>'+esc(q.q)+'</h2>';
 var opts=q.future?FUTURES.map(function(f){return [f.t,f.k];}):q.o;
 opts.forEach(function(o,i){h+='<button data-i="'+i+'">'+esc(o[0])+'</button>';});
 app.innerHTML=h;
 [].forEach.call(app.querySelectorAll('button'),function(b){
  b.onclick=function(){
   var o=opts[+b.getAttribute('data-i')];
   if(q.future){future=o[1];}else{score[o[1]]++;}
   step++; if(step<Q.length){render();window.scrollTo(0,0);}else{result();}
  };
 });
}
function result(){
 var keys=['patience','fact','voice','worth'];
 keys.sort(function(a,b){
  if(score[b]!==score[a])return score[b]-score[a];
  if(a===future)return -1; if(b===future)return 1; return 0;
 });
 var top=keys[0],second=keys[1],r=R[top],C=r.c;
 var fut=FUTURES.filter(function(f){return f.k===future;})[0].t;
 var u=function(to){return BASE+'?to='+to+'&utm_source='+encodeURIComponent(src)+'';};
 var h='<div class="hd"><div class="lb" style="color:#e9d9a6">【なりたい未来】</div><div class="fut">'+esc(fut)+'</div></div>'
+'<div class="hd"><div class="lb" style="color:#f1a7ab">【いま足りないもの】</div><div class="name">'+esc(r.n)+'</div></div>'
 +'<div class="card pk"><span class="tag" style="background:'+C+'">こんな状況ではありませんか</span>'
 +r.s.map(function(x){return '<div class="it" style="border-left-color:'+C+'">'+esc(x)+'</div>';}).join('')+'</div>'
 +'<div class="card pk"><span class="tag" style="background:'+C+'">なぜ、そうなるのか</span><p class="tx">'+esc(r.w)+'</p>'+(r.r?'<p class="cite">'+esc(r.r)+'</p>':'')+'</div>'
 +'<div class="card pk"><span class="tag" style="background:'+C+'">こう考えてみてください</span><p class="tx">'+esc(r.a)+'</p></div>'
 +'<div class="card pk box"><p class="cta">あなたの恋に合った方法で<br>「'+esc(fut)+'」を<br>叶えるための具体的な行動を教えます</p>'
 +'<a class="btn" id="b2" style="margin:0" href="'+u('guide')+'">相談したい方はこちら</a></div>';
 app.innerHTML=h; window.scrollTo(0,0);
}

setTimeout(function(){try{music();}catch(e){}},60);
start();
</script>
